<!DOCTYPE html>
<html lang="en-US">
<head>
<title>Test Product - Amazon.com</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Test Widget Pro",
  "image": "https://example.com/image.jpg",
  "offers": {
    "@type": "Offer",
    "price": "29.99",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock"
  }
}
</script>
</head>
<body>
<h1 id="productTitle">Test Widget Pro</h1>
<div class="priceToPay">
  <span class="a-offscreen">$29.99</span>
</div>
<div id="availability">
  <span>In Stock</span>
</div>
<img id="landingImage" src="https://example.com/image.jpg" alt="Test Widget Pro" />
</body>
</html>
